name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run verify:copy
      - run: npm test
      - run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: --bundles appimage,deb
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles msi,nsis
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Linux desktop dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - name: Collect platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rust_target }}-bundle
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and latest manifest
        run: node scripts/create-release-manifest.mjs "$RELEASE_TAG" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Choir Cleanup ${{ env.RELEASE_TAG }}
          body: |
            Local-first score-aligned rehearsal-pack workbench.

            These desktop builds are unsigned. Check SHA256SUMS before installation.
          files: release-assets/**

name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run verify:copy
      - run: npm test
      - run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: --bundles appimage,deb
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles msi,nsis
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Linux desktop dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Choir Cleanup ${{ env.RELEASE_TAG }}
          releaseBody: |
            Local-first score-aligned rehearsal-copy workbench.

            These desktop builds are unsigned. Check SHA256SUMS before installation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download built assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdir release-assets && gh release download "$RELEASE_TAG" --dir release-assets
      - name: Create checksums and latest manifest
        run: node scripts/create-release-manifest.mjs "$RELEASE_TAG" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" release-assets
      - name: Publish manifest and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS release-assets/latest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
